*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--g)}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:12px 18px;min-height:66px}.brand{display:flex;gap:10px;align-items:center;color:var(--g);font-weight:850;font-size:19px}.logo{background:var(--g);color:#fff;border-radius:12px;width:39px;height:39px;display:grid;place-items:center;font-weight:900}.tagline{font-size:10px;font-weight:500;color:var(--muted);margin-top:2px}.topright{display:flex;gap:8px;align-items:center}.layout{max-width:1400px;margin:auto;display:grid;grid-template-columns:225px minmax(0,1fr);min-height:calc(100vh - 66px)}aside{background:#fff;border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:5px}.navlabel{font-size:10px;color:#87928a;font-weight:850;letter-spacing:1px;padding:12px}.nav{border:0;background:transparent;text-align:left;padding:12px;border-radius:10px;color:#48564d;font-size:13px;font-weight:700;display:flex;gap:10px;align-items:center}.nav.active,.nav:hover{background:var(--mint);color:var(--g)}.nav span{font-size:18px;width:22px;text-align:center}main{padding:27px;min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:20px}.eyebrow{font-size:10px;letter-spacing:1.3px;color:var(--g2);font-weight:850}.head h1{font-size:27px;letter-spacing:-.5px;margin:7px 0}.desc{font-size:13px;line-height:1.6;color:var(--muted);margin:0;max-width:750px}.btn{border:0;background:var(--g);color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;font-size:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}.btn:hover{background:#0b3f27}.btn.secondary{background:#fff;color:var(--g);border:1px solid #cbded0}.btn.gold{background:var(--gold);color:#332609}.btn.red{background:#fff;color:var(--red);border:1px solid #f0d0cd}.btn:disabled{opacity:.55;cursor:not-allowed}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;min-width:0}.grid{display:grid;gap:14px}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.three{grid-template-columns:repeat(3,minmax(0,1fr))}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.hero{background:linear-gradient(120deg,#0f5132,#19794b);color:#fff;padding:25px;border-radius:18px;margin-bottom:16px}.hero h2{font-size:25px;line-height:1.2;margin:8px 0}.hero p{color:#e1f1e6;font-size:13px;line-height:1.65;max-width:700px}.section{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:23px 0 12px}.section h2{font-size:17px;margin:0}.section p{font-size:11px;color:var(--muted);margin:4px 0}.feature{cursor:pointer}.feature:hover{border-color:#9bc8a8}.featureicon{font-size:23px;background:var(--mint);width:43px;height:43px;border-radius:12px;display:grid;place-items:center;margin-bottom:12px}.feature h3{font-size:14px;margin:0 0 7px}.feature p{font-size:12px;line-height:1.55;color:var(--muted);margin:0 0 12px}.linkish{font-size:12px;color:var(--g);font-weight:850}.label{display:block;font-size:12px;font-weight:800;margin:13px 0 6px}.field{width:100%;border:1px solid #d4dfd7;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:#67a77a;box-shadow:0 0 0 3px #e5f5e9}textarea.field{min-height:90px;resize:vertical}.formrow{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.notice{padding:12px 14px;background:#fff8e8;border:1px solid #f0dfb6;color:#6a531b;border-radius:12px;font-size:12px;line-height:1.6;margin:12px 0}.greenbox{background:var(--mint);border:1px solid #d1ead9;border-radius:12px;padding:14px}.muted{color:var(--muted)}.small{font-size:11px;line-height:1.6}.value{font-size:23px;font-weight:850;color:var(--g);margin:5px 0}.sourcegrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.source{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}.source h3{font-size:14px;margin:0}.source p{font-size:11px;line-height:1.55;color:var(--muted);margin:0;flex:1}.tag{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf4ef;color:#326445;font-size:10px;font-weight:850}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;gap:12px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#fff}.itembody{flex:1;min-width:0}.item h3{font-size:13px;margin:0 0 5px}.item p{font-size:11px;line-height:1.5;color:var(--muted);margin:0}.empty{text-align:center;border:1px dashed #cbd8ce;border-radius:12px;padding:28px;color:var(--muted)}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#f0f3f1;font-size:10px;font-weight:800}.status.approved{background:#e1f4e7;color:#176239}.status.pending{background:#fff0cf;color:#80550b}.status.rejected{background:#fce9e7;color:#a32b22}.hidden{display:none!important}.footer{font-size:10px;color:var(--muted);line-height:1.6;margin-top:18px}.mobilebar{display:none}.toast{position:fixed;z-index:50;bottom:85px;left:50%;transform:translateX(-50%);background:#173b27;color:#fff;padding:11px 15px;border-radius:10px;font-size:12px;max-width:90vw;box-shadow:0 8px 24px #0002}.modalback{position:fixed;inset:0;background:#10271acc;z-index:40;display:grid;place-items:center;padding:16px}.modal{width:min(100%,500px);max-height:90vh;overflow:auto;background:#fff;border-radius:18px;padding:22px}.modal h2{margin:0 0 8px;font-size:21px}.modalclose{float:right;border:0;background:#eef4ef;border-radius:9px;padding:6px 10px}.qrplaceholder{border:1px dashed #bacbbf;background:#f8fbf9;border-radius:12px;min-height:140px;display:grid;place-items:center;text-align:center;padding:15px}.accountrow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:12px}.accountrow:last-child{border-bottom:0}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:18px 14px 88px}.top{padding:10px 14px}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.mobilebar{display:flex;position:fixed;z-index:20;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);justify-content:space-around;padding:6px 3px calc(6px + env(safe-area-inset-bottom))}.mobilebar button{border:0;background:transparent;color:#657269;display:flex;flex-direction:column;gap:3px;align-items:center;font-size:9px;padding:4px;min-width:0}.mobilebar button span:first-child{font-size:18px}.mobilebar button.active{color:var(--g);font-weight:850}.head h1{font-size:23px}.hero h2{font-size:22px}}
@media(max-width:520px){.two,.three,.sourcegrid,.formrow{grid-template-columns:1fr}.card{padding:15px}.hero{padding:20px}.topright .btn{padding:9px}.brand{font-size:17px}.tagline{font-size:9px}.head{display:block}.head>.btn{margin-top:10px}}

<script type="module">
/* KONFIGURASI: isi dari Firebase Console. Jangan pernah memasukkan service-account/private key di sini. */
const firebaseConfig = {
  apiKey: "GANTI_DENGAN_FIREBASE_WEB_API_KEY",
  authDomain: "GANTI_DENGAN_PROJECT_ID.firebaseapp.com",
  projectId: "GANTI_DENGAN_PROJECT_ID",
  appId: "GANTI_DENGAN_FIREBASE_APP_ID"
};
/* Pengaturan pembayaran manual. Ganti placeholder setelah QRIS dan rekening bisnis tersedia. */
const PAYMENT = {
  amount: 99000,
  qrisImage: "", // URL gambar QRIS milik penjual, setelah diunggah ke hosting aman
  bankName: "GANTI DENGAN NAMA BANK",
  accountNumber: "GANTI DENGAN NOMOR REKENING",
  accountName: "GANTI DENGAN NAMA PEMILIK REKENING",
  whatsapp: "" // opsional: nomor bantuan resmi dalam format internasional, tanpa tanda +
};
const ADMIN_UIDS = []; // isi UID Google admin hanya jika dibutuhkan untuk tampilan admin; tetap amankan dengan Firestore Rules
const firebaseReady = !firebaseConfig.apiKey.startsWith("GANTI_") && !firebaseConfig.projectId.startsWith("GANTI_") && !firebaseConfig.appId.startsWith("GANTI_");
let fb=null, auth=null, db=null, user=null, entitlement=null, paymentRequests=[], page="home";
const SOURCES=[
 {name:"LinkedIn Jobs",type:"Lowongan kerja",desc:"Cari lowongan remote dan periksa lokasi kandidat yang diterima.",url:"https://www.linkedin.com/jobs/"},
 {name:"Indeed",type:"Lowongan kerja",desc:"Cari lowongan dengan kata kunci dan lokasi yang sesuai.",url:"https://www.indeed.com/"},
 {name:"Remote OK",type:"Remote jobs",desc:"Jelajahi pekerjaan remote; periksa syarat negara pada iklan asli.",url:"https://remoteok.com/"},
 {name:"We Work Remotely",type:"Remote jobs",desc:"Sumber lowongan jarak jauh di berbagai kategori.",url:"https://weworkremotely.com/"},
 {name:"Upwork",type:"Freelance",desc:"Cari proyek dan ajukan proposal melalui akun platform.",url:"https://www.upwork.com/nx/search/jobs/"},
 {name:"Fiverr",type:"Freelance",desc:"Jelajahi layanan freelance dan kebutuhan klien.",url:"https://www.fiverr.com/"},
 {name:"Wellfound",type:"Startup jobs",desc:"Cari peluang startup dan pastikan kelayakan lokasi.",url:"https://wellfound.com/jobs"},
 {name:"FlexJobs",type:"Remote jobs",desc:"Situs pencarian kerja; sebagian layanan mungkin berbayar.",url:"https://www.flexjobs.com/"}
];
const CATS=[
 ["Administrasi & Virtual Assistant","virtual assistant remote worldwide","🗂️"],
 ["Writing & Translation","remote content writer translator worldwide","✍️"],
 ["Customer Support","remote customer support worldwide","🎧"],
 ["Desain & Digital Marketing","remote graphic designer digital marketing worldwide","🎨"],
 ["Data Entry","remote data entry worldwide","⌨️"],
 ["Freelance umum","freelance projects online","🌎"]
];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD",maximumFractionDigits:2}).format(n||0);
const idr=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n||0);
function toast(s){$("toast").textContent=s;$("toast").classList.remove("hidden");clearTimeout(window._toast);window._toast=setTimeout(()=>$("toast").classList.add("hidden"),3000)}
function localApps(){try{return JSON.parse(localStorage.getItem("cd_apps_"+(user?.uid||"guest"))||"[]")}catch{return []}}
function saveLocalApps(a){localStorage.setItem("cd_apps_"+(user?.uid||"guest"),JSON.stringify(a))}
function go(p){page=p;render();window.scrollTo({top:0,behavior:"smooth"})}
function header(k,t,d,button=""){return `<div class="head"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="desc">${d}</p></div>${button}</div>`}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const m=$("main");if(!m)return;
 if(page==="home")m.innerHTML=home();if(page==="opportunities")m.innerHTML=opportunities();if(page==="prepare")m.innerHTML=prepare();if(page==="calculator")m.innerHTML=calculator();if(page==="tracker")m.innerHTML=tracker();if(page==="account")m.innerHTML=account();if(page==="admin")m.innerHTML=adminPage();if(page==="opportunities")sourceRender();
}
function home(){let a=localApps();return `${header("DASHBOARD","Beranda","Ruang kerja untuk menemukan peluang internasional, menyiapkan dokumen, dan memantau progres lamaran.")}
<section class="hero"><div class="eyebrow" style="color:#c5ead0">CUANDOLLAR · RUANG KERJAMU</div><h2>Mulai langkahmu menuju peluang kerja internasional.</h2><p>Jelajahi sumber pencarian, siapkan lamaran, hitung estimasi pendapatan, dan catat progres dalam satu aplikasi.</p><button class="btn gold" onclick="window.__go('opportunities')">Jelajahi Peluang →</button></section>
<div class="grid four"><div class="card"><div class="small muted">Catatan lamaran</div><div class="value">${a.length}</div><div class="small muted">Tersimpan di perangkat ini</div></div><div class="card"><div class="small muted">Akses akun</div><div class="value" style="font-size:17px">${entitlement?.premiumActive?"Premium aktif":"Belum aktif"}</div><div class="small muted">Status dibaca dari Firestore</div></div><div class="card"><div class="small muted">Biaya akses</div><div class="value" style="font-size:17px">Rp99.000</div><div class="small muted">Sekali bayar</div></div><div class="card"><div class="small muted">Langganan</div><div class="value" style="font-size:17px">Tidak ada</div><div class="small muted">Akses sesuai ketentuan</div></div></div>
<div class="section"><div><h2>Fitur utama</h2><p>Pilih fitur untuk mulai.</p></div></div><div class="grid two">
<div class="card feature" onclick="window.__go('opportunities')"><div class="featureicon">🧭</div><h3>Jelajahi Peluang</h3><p>Temukan sumber lowongan dan proyek tanpa admin memperbarui daftar setiap hari.</p><span class="linkish">Buka fitur →</span></div>
<div class="card feature" onclick="window.__go('prepare')"><div class="featureicon">📝</div><h3>Siapkan Lamaran</h3><p>Buat draf awal CV, cover letter, dan proposal yang dapat diedit.</p><span class="linkish">Buka fitur →</span></div>
<div class="card feature" onclick="window.__go('calculator')"><div class="featureicon">💵</div><h3>Hitung Cuan</h3><p>Hitung estimasi penghasilan setelah biaya platform dan kurs yang kamu masukkan.</p><span class="linkish">Buka fitur →</span></div>
<div class="card feature" onclick="window.__go('tracker')"><div class="featureicon">📋</div><h3>Lamaran Saya</h3><p>Simpan dan pantau progres lamaran di perangkat ini.</p><span class="linkish">Buka fitur →</span></div></div>
<p class="footer">CuanDollar bukan perekrut dan tidak menjamin pekerjaan atau penghasilan. Periksa lowongan, kelayakan negara, dan ketentuan di situs sumber. Versi ini memerlukan konfigurasi Firebase dan pembayaran sebelum siap digunakan publik.</p>`}
function opportunities(){return `${header("JELAJAHI PELUANG","Temukan sumber pekerjaan","Pilih kategori dan kata kunci, lalu buka situs sumber. Lowongan, gaji, dan kelayakan Indonesia harus diverifikasi di halaman asli.")}
<div class="notice">Waspada penipuan: jangan membayar biaya rekrutmen yang mencurigakan. Pastikan pekerjaan menerima kandidat dari Indonesia dan periksa kontrak, metode pembayaran, serta reputasi pemberi kerja.</div>
<div class="card"><label class="label">Kategori</label><select id="cat" class="field" onchange="window.__catChange()">${CATS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")}</select><label class="label">Kata kunci</label><input id="keyword" class="field" value="${CATS[0][1]}" oninput="window.__sourcesRender()"><p class="small muted">Coba tambahkan “worldwide”, “global remote”, atau “Indonesia”.</p></div>
<div class="section"><div><h2>Sumber pencarian</h2><p>Situs eksternal, bukan daftar lowongan yang dikelola CuanDollar.</p></div></div><div id="sourcegrid" class="sourcegrid"></div>
<div class="section"><div><h2>Setelah menemukan pekerjaan</h2><p>Salin deskripsi dan siapkan dokumen.</p></div></div><div class="grid two"><div class="card"><h3>📝 Siapkan dokumen</h3><p class="small muted">Gunakan deskripsi pekerjaan untuk membuat draf lamaran.</p><button class="btn secondary" onclick="window.__go('prepare')">Siapkan Lamaran</button></div><div class="card"><h3>📋 Simpan progres</h3><p class="small muted">Catat posisi dan tautan yang kamu temukan.</p><button class="btn secondary" onclick="window.__go('tracker')">Catat Lamaran</button></div></div>`}
function sourceRender(){let q=($("keyword")?.value||"remote jobs").trim();let e=encodeURIComponent(q);let urls={"LinkedIn Jobs":"https://www.linkedin.com/jobs/search/?keywords="+e,"Indeed":"https://www.indeed.com/jobs?q="+e,"Upwork":"https://www.upwork.com/nx/search/jobs/?q="+e};$("sourcegrid").innerHTML=SOURCES.map(s=>`<div class="source"><span class="tag">${s.type}</span><h3>${s.name}</h3><p>${s.desc}</p><a class="btn secondary" target="_blank" rel="noopener noreferrer" href="${urls[s.name]||s.url}">Buka sumber ↗</a></div>`).join("")}
function prepare(){return `${header("SIAPKAN LAMARAN","Studio Lamaran","Buat draf awal, edit, lalu periksa kebenaran semua informasi sebelum mengirim.")}
<div class="notice">Draf dibuat dari template lokal, bukan penilaian otomatis atau jaminan lolos seleksi. Jangan masukkan nomor identitas, kata sandi, atau informasi sensitif.</div><div class="card">
<div class="formrow"><div><label class="label">Nama</label><input id="pn" class="field" placeholder="Nama yang digunakan"></div><div><label class="label">Posisi</label><input id="pr" class="field" placeholder="Contoh: Virtual Assistant"></div></div>
<label class="label">Pengalaman dan keterampilan</label><textarea id="pe" class="field" placeholder="Tuliskan keterampilan, alat yang dikuasai, dan contoh pengalaman nyata."></textarea>
<label class="label">Perusahaan / klien</label><input id="pc" class="field" placeholder="Nama perusahaan (opsional)">
<label class="label">Deskripsi pekerjaan</label><textarea id="pd" class="field" placeholder="Tempel deskripsi pekerjaan dari situs sumber."></textarea>
<label class="label">Jenis dokumen</label><select id="pt" class="field"><option value="cover">Cover letter</option><option value="proposal">Proposal freelance</option><option value="cv">Ringkasan profil CV</option></select>
<button class="btn" style="margin-top:15px" onclick="window.__draft()">Buat draf</button></div><div id="draftbox" class="card hidden" style="margin-top:14px"><div class="section"><h2>Draf dapat diedit</h2><span class="tag">Periksa sebelum digunakan</span></div><textarea id="draft" class="field" style="min-height:300px"></textarea><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn" onclick="window.__copyDraft()">Salin</button><button class="btn secondary" onclick="window.__downloadDraft()">Unduh TXT</button></div></div>`}
function draft(){let n=$("pn").value.trim()||"[Nama]",r=$("pr").value.trim()||"[Posisi]",e=$("pe").value.trim()||"[Tambahkan keterampilan dan pengalaman]",c=$("pc").value.trim()||"Hiring Team",d=$("pd").value.trim(),t=$("pt").value;let x="";
if(t==="cover")x=`Dear ${c},\n\nI am writing to express my interest in the ${r} position. My relevant skills and experience include: ${e}.\n\n${d?"Based on the job description, I understand the role involves: "+d.slice(0,500):"I would welcome the opportunity to discuss how my skills may match your needs."}\n\nThank you for your time and consideration. I look forward to hearing from you.\n\nBest regards,\n${n}`;
else if(t==="proposal")x=`Hello ${c},\n\nI would like to submit my proposal for the ${r} project.\n\nRelevant skills and experience:\n${e}\n\nMy understanding of the project:\n${d||"[Summarize the client's needs]"}\n\nProposed approach:\n1. Confirm goals and deliverables.\n2. Agree on timeline, communication, and milestones.\n3. Deliver the work and incorporate agreed feedback.\n\nBest regards,\n${n}`;
else x=`${n}\nTarget role: ${r}\n\nProfessional summary\nI am a motivated candidate with skills in ${e}. I aim to contribute through reliable work, clear communication, and continuous learning.\n\nRelevant skills and experience\n${e}\n\nTailoring reminder\nAdd specific achievements, tools, examples, and measurable results. Compare this summary with the role requirements:\n${d||"[Paste job description]"}`;
$("draft").value=x;$("draftbox").classList.remove("hidden");$("draftbox").scrollIntoView({behavior:"smooth"})}
async function copyDraft(){try{await navigator.clipboard.writeText($("draft").value);toast("Draf disalin.")}catch{$("draft").select();toast("Pilih teks lalu gunakan menu Salin di HP.")}}
function downloadDraft(){let b=new Blob([$("draft").value],{type:"text/plain;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="draf-lamaran-cuandollar.txt";a.click();URL.revokeObjectURL(a.href)}
function calculator(){return `${header("HITUNG CUAN","Kalkulator penghasilan","Estimasi berdasarkan tarif, jam kerja, biaya platform, dan kurs yang kamu masukkan.")}
<div class="grid two"><div class="card"><label class="label">Tarif per jam (USD)</label><input id="rate" class="field" type="number" min="0" value="15" oninput="window.__calc()"><label class="label">Jam per bulan</label><input id="hours" class="field" type="number" min="0" value="40" oninput="window.__calc()"><label class="label">Biaya platform (%)</label><input id="fee" class="field" type="number" min="0" max="100" value="10" oninput="window.__calc()"><label class="label">Kurs USD ke IDR</label><input id="fx" class="field" type="number" min="1" value="16000" oninput="window.__calc()"><p class="small muted">Kurs contoh, bukan kurs real-time. Pajak, biaya transfer, dan potongan lain belum dihitung.</p></div><div class="card"><div class="greenbox"><div class="small muted">Pendapatan kotor</div><div id="gross" class="value">$600.00</div><div id="grossidr" class="small muted"></div></div><div class="greenbox" style="margin-top:10px"><div class="small muted">Biaya platform</div><div id="feeusd" class="value">−$60.00</div><div id="feeidr" class="small muted"></div></div><div class="greenbox" style="margin-top:10px"><div class="small muted">Estimasi bersih</div><div id="netidr" class="value">Rp8.640.000</div><div id="netusd" class="small muted">$540.00</div></div></div></div>`}
function calc(){let r=Math.max(0,+$("rate").value||0),h=Math.max(0,+$("hours").value||0),f=Math.min(100,Math.max(0,+$("fee").value||0)),x=Math.max(0,+$("fx").value||0),g=r*h,z=g*f/100,n=g-z;$("gross").textContent=usd(g);$("grossidr").textContent=idr(g*x);$("feeusd").textContent="−"+usd(z);$("feeidr").textContent=idr(z*x);$("netidr").textContent=idr(n*x);$("netusd").textContent=usd(n)+" setelah biaya platform"}
function tracker(){let a=getApps();return `${header("LAMARAN SAYA","Pantau progres lamaran","Catatan disimpan lokal di browser ini. Untuk menghindari kehilangan, ekspor cadangan secara berkala.")}
<div class="card"><div class="formrow"><div><label class="label">Posisi / proyek</label><input id="an" class="field" placeholder="Contoh: Content Writer"></div><div><label class="label">Perusahaan / klien</label><input id="ac" class="field" placeholder="Nama perusahaan"></div></div><label class="label">Tautan lowongan (opsional)</label><input id="al" class="field" placeholder="https://..."><div class="formrow"><div><label class="label">Status</label><select id="as" class="field"><option value="saved">Ingin dilamar</option><option value="applied">Sudah melamar</option><option value="interview">Wawancara</option><option value="rejected">Tidak lanjut</option><option value="offer">Mendapat tawaran</option></select></div><div><label class="label">Tanggal</label><input id="ad" type="date" class="field" value="${new Date().toISOString().slice(0,10)}"></div></div><label class="label">Catatan</label><input id="at" class="field" placeholder="Tindak lanjut, tenggat, dll."><button class="btn" style="margin-top:14px" onclick="window.__addApp()">Simpan lamaran</button></div>
<div class="section"><div><h2>Catatan tersimpan (${a.length})</h2><p>Hanya tersimpan pada browser/perangkat ini.</p></div><button class="btn secondary" onclick="window.__exportApps()">Ekspor</button></div><div class="list">${a.length?a.slice().reverse().map((v,j)=>item(v,a.length-1-j)).join(""):`<div class="empty">📋<p>Belum ada lamaran. Tambahkan catatan pertama di atas.</p></div>`}</div><p class="footer">Data belum disinkronkan ke akun. Menghapus data browser dapat menghilangkannya.</p>`}
function getApps(){try{return JSON.parse(localStorage.getItem("cd_apps_"+(user?.uid||"guest"))||"[]")}catch{return []}}
function saveApps(a){localStorage.setItem("cd_apps_"+(user?.uid||"guest"),JSON.stringify(a))}
function item(a,i){let labels={saved:"Ingin dilamar",applied:"Sudah melamar",interview:"Wawancara",rejected:"Tidak lanjut",offer:"Mendapat tawaran"};return `<div class="item"><div>📄</div><div class="itembody"><h3>${esc(a.name)}${a.company?" — "+esc(a.company):""}</h3><p>${esc(a.date||"")} · ${esc(a.note||"Tanpa catatan")}</p>${a.link?`<p><a target="_blank" rel="noopener" href="${esc(a.link)}">Buka tautan ↗</a></p>`:""}<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px"><select class="field" style="max-width:170px;padding:7px" onchange="window.__status(${i},this.value)">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${a.status===k?"selected":""}>${v}</option>`).join("")}</select><button class="btn red" style="padding:7px 9px" onclick="window.__deleteApp(${i})">Hapus</button></div></div></div>`}
function addApp(){let n=$("an").value.trim(),l=$("al").value.trim();if(!n){toast("Isi posisi/proyek terlebih dahulu.");return}if(l&&!/^https?:\/\//i.test(l)){toast("Tautan harus diawali http:// atau https://");return}let a=getApps();a.push({name:n,company:$("ac").value.trim(),link:l,status:$("as").value,date:$("ad").value,note:$("at").value.trim()});saveApps(a);render();toast("Catatan disimpan di browser ini.")}
function statusApp(i,s){let a=getApps();a[i].status=s;saveApps(a);render();toast("Status diperbarui.")}
function deleteApp(i){if(!confirm("Hapus catatan ini?"))return;let a=getApps();a.splice(i,1);saveApps(a);render()}
function exportApps(){let b=new Blob([JSON.stringify(getApps(),null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="cuandollar-lamaran.json";a.click();URL.revokeObjectURL(a.href)}
function account(){let premium=!!entitlement?.premiumActive;return `${header("AKUN & AKSES","Login dan akses premium","Login menggunakan Google. Akses premium aktif setelah pembayaran diverifikasi oleh admin.")}
<div class="grid two"><div class="card"><div class="featureicon">👤</div><h3 style="margin:0 0 8px">Akun Google</h3><p class="small muted">${user?`Login sebagai <strong>${esc(user.email||user.displayName||"pengguna")}</strong>.`:"Login untuk mengajukan aktivasi akses dan melihat status akun."}</p>${user?`<button class="btn secondary" onclick="window.__signout()">Keluar</button>`:`<button class="btn" onclick="window.__signin()">Login dengan Google</button>`}</div>
<div class="card"><div class="featureicon">🔐</div><h3 style="margin:0 0 8px">Akses premium</h3><div class="value">${premium?"Premium aktif":"Rp99.000 sekali bayar"}</div><p class="small muted">${premium?"Akses premium tercatat aktif pada akun ini.":"Tidak ada langganan. Setelah membayar, ajukan verifikasi dan tunggu konfirmasi admin."}</p><span class="status ${premium?"approved":"pending"}">${premium?"AKTIF":user?"BELUM AKTIF":"LOGIN DIPERLUKAN"}</span></div></div>
<div class="section"><div><h2>Pembelian akses</h2><p>Pembayaran manual QRIS atau transfer bank.</p></div></div>
<div class="notice">Pembayaran manual belum otomatis terkonfirmasi. Jangan mengirim data kartu, PIN, atau OTP. Setelah transfer, ajukan verifikasi dan admin akan memeriksa pembayaran di luar aplikasi.</div>
<div class="grid two"><div class="card"><div class="featureicon">▦</div><h3 style="margin:0 0 7px">Bayar dengan QRIS</h3><p class="small muted">Gunakan QRIS resmi milik penjual yang akan dipasang pada konfigurasi. Periksa nama merchant di aplikasi pembayaran sebelum mengirim uang.</p><button class="btn" onclick="window.__payment('qris')">Lihat instruksi QRIS</button></div>
<div class="card"><div class="featureicon">🏦</div><h3 style="margin:0 0 7px">Transfer bank</h3><p class="small muted">Transfer ke rekening resmi penjual. Nomor rekening dan nama pemilik harus diisi sebelum aplikasi dipublikasikan.</p><button class="btn secondary" onclick="window.__payment('bank')">Lihat instruksi transfer</button></div></div>
<div class="section"><div><h2>Status pembayaran</h2><p>Riwayat permintaan verifikasi akun ini.</p></div><button class="btn secondary" onclick="window.__refreshPayments()">Muat ulang</button></div>
<div id="paymentlist">${paymentRequests.length?paymentRequests.map(p=>`<div class="item"><div>🧾</div><div class="itembody"><h3>Rp99.000 · ${esc(p.method==="qris"?"QRIS":"Transfer bank")}</h3><p>Diajukan: ${p.createdAt?.toDate?p.createdAt.toDate().toLocaleString("id-ID"): "Menunggu waktu server"} </p><span class="status ${p.status==="approved"?"approved":p.status==="rejected"?"rejected":"pending"}">${esc(p.status==="approved"?"Disetujui":p.status==="rejected"?"Ditolak":"Menunggu verifikasi")}</span></div></div>`).join(""):`<div class="empty">Belum ada permintaan verifikasi pembayaran.</div>`}</div>
<p class="footer">Akses premium hanya dianggap aktif jika dokumen entitlement di Firestore ditetapkan oleh proses admin tepercaya. Jangan percaya screenshot pembayaran saja. Konfigurasi Firebase, aturan keamanan, QRIS/rekening, dan prosedur admin wajib diselesaikan sebelum peluncuran.</p>
${ADMIN_UIDS.includes(user?.uid)?`<div class="card" style="margin-top:14px"><h3>Admin</h3><button class="btn" onclick="window.__go('admin')">Buka antrean pembayaran</button></div>`:""}`}
function paymentModal(method){if(!user){toast("Login Google terlebih dahulu.");return}let qr=method==="qris";let content=qr?(PAYMENT.qrisImage?`<img src="${PAYMENT.qrisImage}" alt="QRIS pembayaran CuanDollar" style="width:100%;max-width:260px;display:block;margin:auto;border-radius:8px">`:`<div class="qrplaceholder"><div><strong>QRIS belum dipasang</strong><p class="small muted">Admin harus menambahkan URL gambar QRIS resmi pada konfigurasi sebelum peluncuran.</p></div></div>`):`<div class="accountrow"><span>Bank</span><strong>${esc(PAYMENT.bankName)}</strong></div><div class="accountrow"><span>Nomor rekening</span><strong>${esc(PAYMENT.accountNumber)}</strong></div><div class="accountrow"><span>Atas nama</span><strong>${esc(PAYMENT.accountName)}</strong></div>`;
$("modalroot").innerHTML=`<div class="modalback" onclick="if(event.target===this)window.__closeModal()"><div class="modal"><button class="modalclose" onclick="window.__closeModal()">Tutup ✕</button><h2>${qr?"Pembayaran QRIS":"Transfer bank"}</h2><p class="small muted">Akses CuanDollar · pembayaran sekali bayar</p><div class="greenbox" style="text-align:center;margin:14px 0"><div class="small muted">Total pembayaran</div><div class="value">${idr(PAYMENT.amount)}</div></div>${content}<div class="notice">Pastikan penerima dan nominal benar. Setelah membayar, ajukan verifikasi. Status akan tetap menunggu sampai admin memeriksa transaksi.</div><label class="label">Catatan referensi (opsional)</label><input id="paynote" class="field" maxlength="100" placeholder="Contoh: nama pengirim / 4 digit akhir referensi"><button class="btn" style="width:100%;margin-top:14px" onclick="window.__requestPayment('${method}')">Saya sudah membayar — ajukan verifikasi</button><p class="small muted">Jangan masukkan PIN, password, OTP, atau nomor kartu.</p></div></div>`;
}
async function requestPayment(method){if(!user){toast("Login Google terlebih dahulu.");return}if(!db){toast("Firebase belum dikonfigurasi. Permintaan belum tersimpan.");return}try{const {collection,addDoc,serverTimestamp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");const note=$("paynote")?.value.trim()||"";await addDoc(collection(db,"paymentRequests"),{uid:user.uid,email:user.email||"",displayName:user.displayName||"",method,amount:PAYMENT.amount,currency:"IDR",status:"pending",referenceNote:note,createdAt:serverTimestamp()});$("modalroot").innerHTML="";await refreshPayments();toast("Permintaan verifikasi tercatat. Status masih menunggu admin.");}catch(e){console.error(e);toast("Tidak dapat menyimpan permintaan. Periksa koneksi dan Firestore Rules.");}}
function closeModal(){$("modalroot").innerHTML=""}
async function refreshPayments(){if(!user||!db){paymentRequests=[];return}try{const {collection,query,where,getDocs,orderBy}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");const q=query(collection(db,"paymentRequests"),where("uid","==",user.uid));const snap=await getDocs(q);paymentRequests=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.seconds||0)-(a.createdAt?.seconds||0));if(page==="account")render()}catch(e){console.warn(e);}}
function adminPage(){return `${header("ADMIN","Antrean pembayaran","Tampilan ini belum mengizinkan persetujuan dari browser. Verifikasi dan aktivasi dilakukan melalui proses admin tepercaya di Firebase Console.")}<div class="notice">Jangan menambahkan tombol persetujuan publik yang dapat mengubah status premium pengguna. Admin perlu memeriksa bukti transaksi melalui kanal resmi, lalu mengubah dokumen entitlement dengan akun admin yang terlindungi.</div><button class="btn secondary" onclick="window.__go('account')">Kembali ke akun</button>`}
async function initFirebase(){if(!firebaseReady){$("userchip").textContent="Setup Firebase diperlukan";return}try{const appmod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");const authmod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");const dbmod=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");fb=appmod.initializeApp(firebaseConfig);auth=authmod.getAuth(fb);db=dbmod.getFirestore(fb);window.__authmod=authmod;window.__dbmod=dbmod;authmod.onAuthStateChanged(auth,async u=>{user=u;entitlement=null;paymentRequests=[];$("loginBtn").classList.toggle("hidden",!!u);$("logoutBtn").classList.toggle("hidden",!u);$("userchip").textContent=u?(u.displayName||u.email||"Login"):"Belum login";if(u){try{const snap=await dbmod.getDoc(dbmod.doc(db,"entitlements",u.uid));if(snap.exists())entitlement=snap.data();}catch(e){console.warn("Entitlement read failed",e)}await refreshPayments()}render()})}catch(e){console.error(e);$("userchip").textContent="Firebase gagal dimuat";toast("Firebase belum siap. Periksa konfigurasi dan domain resmi.");}}
async function signIn(){if(!auth){toast("Login Google belum aktif. Lengkapi konfigurasi Firebase dahulu.");return}try{await window.__authmod.signInWithPopup(auth,new window.__authmod.GoogleAuthProvider())}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await window.__authmod.signInWithRedirect(auth,new window.__authmod.GoogleAuthProvider())}catch(x){console.error(x);toast("Login gagal. Periksa Authorized domains di Firebase.")}}else{console.error(e);toast("Login gagal: "+(e.code||"periksa konfigurasi Firebase"))}}}
async function signOutUser(){if(auth)await window.__authmod.signOut(auth);user=null;entitlement=null;paymentRequests=[];render();toast("Anda telah keluar.")}
window.__go=go;window.__catChange=()=>{$("keyword").value=CATS[+$("cat").value][1];sourceRender()};window.__sourcesRender=sourceRender;window.__draft=draft;window.__copyDraft=copyDraft;window.__downloadDraft=downloadDraft;window.__calc=calc;window.__addApp=addApp;window.__status=statusApp;window.__deleteApp=deleteApp;window.__exportApps=exportApps;window.__signin=signIn;window.__signout=signOutUser;window.__payment=paymentModal;window.__requestPayment=requestPayment;window.__closeModal=closeModal;window.__refreshPayments=async()=>{await refreshPayments();toast("Status dimuat ulang.")};
window.signIn=signIn;window.signOutUser=signOutUser;
render();initFirebase();
</script>
