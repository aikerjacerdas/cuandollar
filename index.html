<style>
:root{--g:#0f5132;--g2:#18754a;--mint:#e9f7ef;--gold:#f4b740;--ink:#17221c;--muted:#66736b;--line:#e1e8e3;--bg:#f5f8f6;--white:#fff;--red:#a52a22}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #f4b740;outline-offset:2px}a{color:var(--g)}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:var(--g)}.logo{width:42px;height:42px;border-radius:13px;background:var(--g);color:white;display:grid;place-items:center;font-size:22px}.tagline{font-size:12px;color:var(--muted);font-weight:500}.topright{display:flex;align-items:center;gap:10px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);max-width:1240px;margin:auto;min-height:calc(100vh - 72px)}aside{padding:20px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:7px}.navlabel{font-size:11px;letter-spacing:1.3px;font-weight:800;color:var(--muted);padding:8px}.nav{border:0;text-align:left;padding:12px;border-radius:11px;background:transparent;color:#33443a;display:flex;align-items:center;gap:10px}.nav:hover,.nav.active{background:var(--mint);color:var(--g);font-weight:750}.navicon{width:24px;text-align:center}main{padding:26px;min-width:0}.head{margin-bottom:20px}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--g2)}h1{font-size:30px;line-height:1.2;margin:5px 0 10px}h2{font-size:21px;margin:0 0 7px}h3{font-size:17px;margin:0 0 8px}.desc,.muted,.small{color:var(--muted)}.small{font-size:13px}.muted{font-weight:400}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 2px 8px #102b1b05;min-width:0}.hero{background:linear-gradient(120deg,#0f5132,#18754a);color:white;border-radius:22px;padding:28px;margin-bottom:18px}.hero h2{font-size:28px;max-width:700px}.hero p{color:#e3f3e9;max-width:680px}.grid{display:grid;gap:14px}.four{grid-template-columns:repeat(4,minmax(0,1fr))}.two{grid-template-columns:repeat(2,minmax(0,1fr))}.section{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:24px 0 12px}.feature{cursor:pointer;transition:transform .15s}.feature:hover{transform:translateY(-2px);border-color:#a8d4b9}.featureicon{font-size:24px;margin-bottom:8px}.btn{border:0;border-radius:12px;background:var(--g);color:white;padding:11px 16px;font-weight:750;display:inline-flex;justify-content:center;align-items:center;gap:8px;text-decoration:none}.btn:hover{filter:brightness(1.08)}.btn.gold{background:var(--gold);color:#35280a}.btn.secondary{background:white;border:1px solid #cddbd1;color:var(--g)}.btn.danger{background:#fff0ee;color:var(--red);border:1px solid #f0c8c4}.btn:disabled{opacity:.5;cursor:not-allowed}.field{display:block;width:100%;border:1px solid #cdd8d0;border-radius:10px;padding:11px 12px;background:#fff;color:var(--ink);margin:5px 0 14px}.label{font-size:13px;font-weight:750;display:block}.notice{background:#fff8e7;border:1px solid #f3df9e;color:#6c5314;border-radius:12px;padding:13px 15px;margin-bottom:16px}.stats{font-weight:800;font-size:24px;color:var(--g);margin:5px 0}.sourcegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.source{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.source h3{margin-top:9px}.pill{display:inline-block;border-radius:999px;background:var(--mint);color:var(--g);padding:4px 9px;font-size:12px;font-weight:750}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row .btn{flex:0 0 auto}.job{display:flex;justify-content:space-between;gap:12px;align-items:start;border-bottom:1px solid var(--line);padding:13px 0}.job:last-child{border:0}.job p{margin:4px 0}.divider{height:1px;background:var(--line);margin:16px 0}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed #cbd8cf;border-radius:14px}.bottom{display:none}.toast{position:fixed;bottom:86px;left:50%;transform:translateX(-50%);z-index:20;background:#17221c;color:white;padding:11px 16px;border-radius:10px;max-width:90vw;box-shadow:0 8px 25px #0002}.hidden{display:none!important}.footer{font-size:12px;color:var(--muted);margin-top:25px}.status{font-weight:800}.status.active{color:var(--g)}.status.pending{color:#926b08}
@media(max-width:850px){.layout{grid-template-columns:1fr}aside{display:none}main{padding:20px 16px 100px}.four{grid-template-columns:repeat(2,minmax(0,1fr))}.sourcegrid{grid-template-columns:1fr}.top{padding:12px 14px}.topright .desktop{display:none}.bottom{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:10}.bottom button{border:0;background:transparent;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0}.bottom button span:first-child{font-size:20px}.bottom button.active{color:var(--g);font-weight:800}.hero{padding:22px}.hero h2{font-size:24px}.section{align-items:start;flex-direction:column}.job{flex-direction:column}.row{align-items:stretch}.row .btn{width:100%}}
@media(max-width:420px){h1{font-size:27px}.four,.two{grid-template-columns:1fr}.hero h2{font-size:22px}.brand{font-size:18px}.logo{width:38px;height:38px}}
</style>

<body>
<header class="top">
  <div class="brand"><div class="logo">C↗</div><div>CuanDollar<div class="tagline">Mulai hari ini, dapatkan cuan dollar!</div></div></div>
  <div class="topright"><span id="loginStatus" class="small desktop">Mode demo</span><button class="btn secondary" id="loginBtn" type="button">Login Google</button></div>
</header>
<div class="layout">
  <aside>
    <div class="navlabel">MENU APLIKASI</div>
    <button class="nav active" data-page="home"><span class="navicon">⌂</span>Beranda</button>

  </aside>

  <button class="active" data-page="home"><span>▦</span>Beranda</button>
  <button data-page="opportunities"><span>◎</span>Peluang</button>
  <button data-page="tracker"><span>▤</span>Lamaran</button>

<div id="toast" class="toast hidden" role="status"></div>
<script>
"use strict";
const $=id=>document.getElementById(id);
let page="home";
const KEY="cuandollar_applications_v1";
const CATS=[
 ["Administrasi & Virtual Assistant","virtual assistant remote worldwide","🗂️"],
 ["Writing & Translation","remote content writer translator worldwide","✍️"],
 ["Customer Support","remote customer support worldwide","🎧"],
 ["Desain & Digital Marketing","remote graphic designer digital marketing worldwide","🎨"],
 ["Data Entry","remote data entry worldwide","⌨️"],
 ["Freelance umum","freelance projects online","🌐"]
];
const SOURCES=[
 {name:"LinkedIn Jobs",type:"Job board",desc:"Cari posisi remote dan gunakan filter lokasi serta kata kunci.",url:"https://www.linkedin.com/jobs/search/?keywords=remote"},
 {name:"Indeed",type:"Job board",desc:"Cari lowongan remote; pastikan negara yang memenuhi syarat sebelum melamar.",url:"https://www.indeed.com/jobs?q=remote"},
 {name:"Upwork",type:"Freelance",desc:"Temukan proyek freelance dan periksa biaya serta ketentuan platform.",url:"https://www.upwork.com/nx/search/jobs/"},
 {name:"Remote OK",type:"Remote jobs",desc:"Papan lowongan remote; cek keterangan negara dan syarat tiap posisi.",url:"https://remoteok.com/"},
 {name:"Wellfound",type:"Startup jobs",desc:"Jelajahi pekerjaan startup dan baca batas lokasi pada deskripsi.",url:"https://wellfound.com/jobs"},
 {name:"We Work Remotely",type:"Remote jobs",desc:"Lowongan remote dari berbagai bidang; kelayakan Indonesia perlu dicek.",url:"https://weworkremotely.com/"}
];
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.remove("hidden");clearTimeout(window.__toastTimer);window.__toastTimer=setTimeout(()=>t.classList.add("hidden"),3200);}
function getApps(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch{return []}}
function saveApps(a){localStorage.setItem(KEY,JSON.stringify(a))}
function go(p){const allowed=["home","opportunities","prepare","calculator","tracker","account"];if(!allowed.includes(p)){toast("Halaman belum tersedia.");return}page=p;render();window.scrollTo({top:0,behavior:"smooth"});$("main").focus({preventScroll:true});}
function header(k,t,d){return `<div class="head"><div class="eyebrow">${esc(k)}</div><h1>${esc(t)}</h1><div class="desc">${esc(d)}</div></div>`}
function home(){let a=getApps();return `${header("DASHBOARD","Beranda","Ruang kerja untuk menemukan peluang internasional, menyiapkan dokumen, dan memantau progres lamaran.")}<section class="hero"><div class="eyebrow" style="color:#c8efda">CUANDOLLAR • RUANG KERJAMU</div><h2>Mulai langkahmu menuju peluang kerja internasional.</h2><p>Jelajahi sumber pencarian, siapkan lamaran, hitung estimasi pendapatan, dan catat progres dalam satu aplikasi.</p><button class="btn gold" data-go="opportunities">Jelajahi Peluang →</button></section><div class="grid four"><div class="card"><div class="small">Catatan lamaran</div><div class="stats">${a.length}</div><div class="small">Tersimpan di perangkat ini</div></div><div class="card"><div class="small">Akses akun</div><div class="stats" style="font-size:20px">Demo</div><div class="small">Status premium belum terhubung</div></div><div class="card"><div class="small">Biaya akses</div><div class="stats">Rp99.000</div><div class="small">Sekali bayar</div></div><div class="card"><div class="small">Langganan</div><div class="stats" style="font-size:20px">Tidak ada</div><div class="small">Akses sesuai ketentuan</div></div></div><div class="section"><div><h2>Fitur utama</h2><p class="small muted">Pilih fitur untuk mulai.</p></div></div><div class="grid two"><div class="card feature" data-go="opportunities"><div class="featureicon">🌍</div><h3>Jelajahi Peluang</h3><p class="small">Temukan sumber lowongan dan proyek yang cocok untukmu.</p><span class="pill">Buka fitur →</span></div><div class="card feature" data-go="prepare"><div class="featureicon">📝</div><h3>Siapkan Lamaran</h3><p class="small">Buat draf CV, cover letter, dan proposal yang dapat diedit.</p><span class="pill">Buka fitur →</span></div><div class="card feature" data-go="calculator"><div class="featureicon">💵</div><h3>Hitung Cuan</h3><p class="small">Hitung estimasi pendapatan setelah biaya platform dan kurs.</p><span class="pill">Buka fitur →</span></div><div class="card feature" data-go="tracker"><div class="featureicon">📋</div><h3>Lamaran Saya</h3><p class="small">Simpan dan pantau progres lamaran di perangkat ini.</p><span class="pill">Buka fitur →</span></div></div><p class="footer">CuanDollar bukan perekrut dan tidak menjamin pekerjaan atau penghasilan. Selalu verifikasi lowongan di situs sumber.</p>`}
function opportunities(){return `${header("JELAJAHI PELUANG","Jelajahi Peluang","Cari sumber pekerjaan internasional. Pastikan lokasi dan kelayakan Indonesia pada halaman asli.")}<div class="notice">Waspada penipuan: jangan membayar biaya rekrutmen yang mencurigakan. Periksa kontrak, metode pembayaran, dan reputasi pemberi kerja. Daftar ini adalah sumber pencarian, bukan daftar lowongan yang sudah diverifikasi CuanDollar.</div><div class="card"><label class="label" for="cat">Kategori</label><select id="cat" class="field">${CATS.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join("")}</select><label class="label" for="keyword">Kata kunci</label><input id="keyword" class="field" value="${esc(CATS[0][1])}" placeholder="Contoh: remote virtual assistant Indonesia"><p class="small muted">Kata kunci digunakan untuk membuka pencarian di situs sumber. Selalu cek apakah lowongan menerima pelamar dari Indonesia.</p></div><div class="section"><div><h2>Sumber pencarian</h2><p class="small muted">Buka sumber dan periksa syarat posisi secara langsung.</p></div></div><div id="sourcegrid" class="sourcegrid"></div><div class="section"><div><h2>Setelah menemukan pekerjaan</h2><p class="small muted">Simpan posisi dan lanjutkan menyiapkan dokumen.</p></div></div><div class="grid two"><div class="card"><h3>📝 Siapkan dokumen</h3><p class="small muted">Buat draf lamaran yang dapat disesuaikan.</p><button class="btn secondary" data-go="prepare">Siapkan Lamaran</button></div><div class="card"><h3>📋 Simpan progres</h3><p class="small muted">Catat posisi dan tautan yang kamu temukan.</p><button class="btn secondary" data-go="tracker">Catat Lamaran</button></div></div>`}
function renderSources(){const grid=$("sourcegrid");if(!grid)return;const q=($("keyword")?.value||"remote jobs").trim()||"remote jobs";const urls={"LinkedIn Jobs":"https://www.linkedin.com/jobs/search/?keywords=","Indeed":"https://www.indeed.com/jobs?q=","Upwork":"https://www.upwork.com/nx/search/jobs/?q=","Remote OK":"https://remoteok.com/remote-","Wellfound":"https://wellfound.com/jobs","We Work Remotely":"https://weworkremotely.com/remote-jobs/search?term="};grid.innerHTML=SOURCES.map(s=>{let href=urls[s.name]?urls[s.name]+encodeURIComponent(q):s.url;return `<article class="source"><span class="pill">${esc(s.type)}</span><h3>${esc(s.name)}</h3><p class="small">${esc(s.desc)}</p><a class="btn secondary" href="${esc(href)}" target="_blank" rel="noopener noreferrer">Buka sumber ↗</a></article>`}).join("");}
function prepare(){return `${header("DOKUMEN","Siapkan Lamaran","Isi informasi dasar untuk membuat draf yang bisa kamu salin dan edit.")}<div class="notice">Periksa kembali isi draf. Jangan memasukkan pengalaman, kemampuan, atau kualifikasi yang tidak benar.</div><div class="card"><label class="label" for="pname">Nama yang dicantumkan</label><input id="pname" class="field" placeholder="Nama lengkap"><label class="label" for="prole">Posisi yang dilamar</label><input id="prole" class="field" placeholder="Contoh: Virtual Assistant"><label class="label" for="pskills">Pengalaman dan keterampilan relevan</label><textarea id="pskills" class="field" rows="4" placeholder="Tuliskan pengalaman nyata, keterampilan, dan contoh hasil kerja."></textarea><label class="label" for="pjob">Ringkasan deskripsi pekerjaan</label><textarea id="pjob" class="field" rows="4" placeholder="Tempel beberapa poin utama dari lowongan."></textarea><div class="row"><button class="btn" id="makeLetter">Buat draf cover letter</button><button class="btn secondary" id="makeProposal">Buat draf proposal freelance</button></div></div><div class="section"><div><h2>Draf lamaran</h2><p class="small muted">Hasil dapat diedit dan disalin.</p></div></div><textarea id="draft" class="field" rows="12" placeholder="Draf akan muncul di sini..."></textarea><button class="btn secondary" id="copyDraft">Salin draf</button>`}
function calculator(){return `${header("KALKULATOR","Hitung Cuan","Perkiraan pendapatan bersih berdasarkan jam kerja, biaya platform, dan kurs yang kamu masukkan.")}<div class="grid two"><div class="card"><label class="label" for="rate">Tarif per jam (USD)</label><input id="rate" class="field" type="number" min="0" step=".5" value="15"><label class="label" for="hours">Jam kerja per bulan</label><input id="hours" class="field" type="number" min="0" step="1" value="40"><label class="label" for="fee">Biaya platform (%)</label><input id="fee" class="field" type="number" min="0" max="100" step="1" value="10"><label class="label" for="fx">Kurs USD ke IDR (Rp)</label><input id="fx" class="field" type="number" min="0" step="100" value="16000"><p class="small muted">Masukkan kurs yang ingin digunakan. Angka ini bukan kurs real-time.</p></div><div class="card"><div class="small">Pendapatan kotor</div><div id="gross" class="stats">$600.00</div><div class="divider"></div><div class="small">Perkiraan biaya platform</div><div id="feeOut" class="stats" style="color:var(--red)">−$60.00</div><div class="divider"></div><div class="small">Pendapatan bersih (estimasi)</div><div id="netUsd" class="stats">$540.00</div><div id="netIdr" class="stats" style="font-size:30px">Rp8.640.000</div><p class="small muted">Belum termasuk pajak, biaya transfer, perubahan kurs, atau biaya lain.</p></div></div>`}
function tracker(){let a=getApps();return `${header("PROGRES","Lamaran Saya","Catat pekerjaan yang kamu temukan dan pantau tahap lamaran. Data disimpan di browser/perangkat ini.")}<div class="card"><h2>Tambah catatan lamaran</h2><label class="label" for="trole">Posisi</label><input id="trole" class="field" placeholder="Contoh: Customer Support"><label class="label" for="tcompany">Perusahaan / klien</label><input id="tcompany" class="field" placeholder="Nama perusahaan atau klien"><label class="label" for="turl">Tautan lowongan (opsional)</label><input id="turl" class="field" type="url" placeholder="https://..."><label class="label" for="tstatus">Status</label><select id="tstatus" class="field"><option>Ingin dilamar</option><option>Lamaran dikirim</option><option>Wawancara</option><option>Diterima</option><option>Ditolak</option><option>Ditutup / tidak lanjut</option></select><label class="label" for="tnotes">Catatan (opsional)</label><textarea id="tnotes" class="field" rows="2" placeholder="Tanggal, tindak lanjut, atau catatan lain"></textarea><button class="btn" id="addApp">Simpan lamaran</button></div><div class="section"><div><h2>Daftar lamaran</h2><p class="small muted">${a.length} catatan tersimpan di perangkat ini.</p></div></div><div id="appList">${a.length?a.map((x,i)=>`<div class="card" style="margin-bottom:12px"><div class="row"><div><h3>${esc(x.role)}</h3><p class="small">${esc(x.company||"Perusahaan belum diisi")}</p></div><span class="pill">${esc(x.status)}</span></div>${x.url?`<p><a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer">Buka tautan lowongan ↗</a></p>`:""}${x.notes?`<p class="small">${esc(x.notes)}</p>`:""}<p class="small muted">Dibuat: ${esc(x.date||"")}</p><button class="btn danger" data-delete="${i}">Hapus catatan</button></div>`).join(""):`<div class="empty">Belum ada catatan. Tambahkan lamaran pertama di atas.</div>`}</div><p class="small muted">Catatan tersimpan di browser ini saja, belum tersinkron antarperangkat atau ke Firebase.</p>`}
function account(){return `${header("AKUN","Akun & Akses","Informasi login dan status akses CuanDollar.")}<div class="notice">Integrasi login Google dan verifikasi pembayaran belum diaktifkan pada berkas mandiri ini. Jangan menganggap tombol demo sebagai bukti login atau pembayaran berhasil.</div><div class="grid two"><div class="card"><h2>Login Google</h2><p class="small muted">Login perlu dikonfigurasi menggunakan Firebase Authentication pada proyek Firebase Anda.</p><button class="btn" id="accountLogin">Siapkan login Google</button></div><div class="card"><h2>Akses premium</h2><div class="stats">Rp99.000</div><p class="small">Sekali bayar · tanpa langganan</p><p class="small muted">Akses baru aktif setelah pembayaran diverifikasi oleh admin. Status saat ini: belum terhubung.</p><button class="btn secondary" id="paymentInfo">Lihat alur akses</button></div></div><div class="section"><div><h2>Catatan keamanan</h2></div></div><div class="card"><p class="small">Jangan menaruh service-account key atau rahasia server di HTML. Status premium harus diperiksa dengan aturan Firestore yang aman dan tidak boleh dapat diubah sendiri oleh pengguna.</p></div>`}
function render(){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));const m=$("main");if(!m)return;const pages={home,opportunities,prepare,calculator,tracker,account};m.innerHTML=pages[page]();if(page==="opportunities")renderSources();if(page==="calculator")calculate();if(page==="tracker")bindTracker();if(page==="prepare")bindPrepare();if(page==="account")bindAccount();m.focus({preventScroll:true});}
function calculate(){const rate=Math.max(0,Number($("rate")?.value)||0),hours=Math.max(0,Number($("hours")?.value)||0),fee=Math.min(100,Math.max(0,Number($("fee")?.value)||0)),fx=Math.max(0,Number($("fx")?.value)||0);const gross=rate*hours,feeUsd=gross*fee/100,net=gross-feeUsd;const usd=n=>new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);const idr=n=>"Rp"+new Intl.NumberFormat("id-ID",{maximumFractionDigits:0}).format(n);$("gross").textContent=usd(gross);$("feeOut").textContent="−"+usd(feeUsd);$("netUsd").textContent=usd(net);$("netIdr").textContent=idr(net*fx);}
function bindTracker(){$("addApp")?.addEventListener("click",()=>{const role=$("trole").value.trim();if(!role){toast("Isi posisi terlebih dahulu.");$("trole").focus();return}const url=$("turl").value.trim();if(url&&!/^https?:\/\//i.test(url)){toast("Tautan harus diawali http:// atau https://");return}const a=getApps();a.unshift({role,company:$("tcompany").value.trim(),url,status:$("tstatus").value,notes:$("tnotes").value.trim(),date:new Date().toLocaleDateString("id-ID")});saveApps(a);render();toast("Catatan lamaran disimpan di perangkat ini.");});document.querySelectorAll("[data-delete]").forEach(b=>b.addEventListener("click",()=>{const a=getApps();a.splice(Number(b.dataset.delete),1);saveApps(a);render();toast("Catatan dihapus.");}));}
function bindPrepare(){function make(kind){const name=$("pname").value.trim()||"[Nama Anda]",role=$("prole").value.trim()||"[Posisi]",skills=$("pskills").value.trim()||"[Tambahkan pengalaman dan keterampilan yang benar-benar Anda miliki]",job=$("pjob").value.trim()||"[Sesuaikan dengan kebutuhan lowongan]";let text;if(kind==="letter")text=`Dear Hiring Team,\n\nI am writing to express my interest in the ${role} position. My relevant experience and skills include:\n${skills}\n\nAfter reviewing the role, I understand that the key needs include:\n${job}\n\nI would welcome the opportunity to discuss how my actual experience could contribute to your team. Thank you for your time and consideration.\n\nBest regards,\n${name}`;else text=`Hello,\n\nI would like to propose my services for the ${role} project.\n\nRelevant skills and experience:\n${skills}\n\nMy understanding of the project:\n${job}\n\nSuggested next step: I would be happy to discuss scope, deliverables, timeline, and budget before confirming the work.\n\nBest regards,\n${name}`;$("draft").value=text;$("draft").focus();} $("makeLetter").addEventListener("click",()=>make("letter"));$("makeProposal").addEventListener("click",()=>make("proposal"));$("copyDraft").addEventListener("click",async()=>{if(!$("draft").value.trim()){toast("Buat draf terlebih dahulu.");return}try{await navigator.clipboard.writeText($("draft").value);toast("Draf disalin.")}catch{$("draft").select();toast("Pilih teks lalu salin dengan Ctrl+C.");}});}
function bindAccount(){$("accountLogin")?.addEventListener("click",()=>toast("Login Google belum dikonfigurasi. Lengkapi Firebase Authentication terlebih dahulu."));$("paymentInfo")?.addEventListener("click",()=>toast("Alur yang direncanakan: login Google → bayar → admin verifikasi → akses diaktifkan."));}
document.addEventListener("click",e=>{const b=e.target.closest("[data-page],[data-go]");if(!b)return;const p=b.dataset.page||b.dataset.go;if(p)go(p);});
document.addEventListener("input",e=>{if(["rate","hours","fee","fx"].includes(e.target.id))calculate();if(e.target.id==="keyword")renderSources();});
document.addEventListener("change",e=>{if(e.target.id==="cat"){const c=CATS[Number(e.target.value)]||CATS[0];if($("keyword"))$("keyword").value=c[1];renderSources();}});
$("loginBtn").addEventListener("click",()=>go("account"));
render();
</script>
</body>
</html>
